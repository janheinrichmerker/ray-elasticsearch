name: CI

on:
  push:

jobs:
  python-build:
    name: "🏗️ Build Python wheels"
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v5
      - name: "🧰 Install Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install build twine
      - name: "🏗️ Build Python wheels"
        run: python -m build
      - name: "🧪 Check package bundles"
        run: twine check dist/*
      - name: "📤 Upload Python wheels"
        uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: wheels
          path: dist
  python-code-check:
    name: 🔍 Check Python code
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        elasticsearch:
          - "7"
          - "7-major"
          - "7-dsl"
          - "7-dsl-major"
          - "7-pydantic"
          - "7-pydantic-major"
          - "8"
          - "8-major"
          - "8-dsl"
          - "8-dsl-major"
          - "8-pydantic"
          - "8-pydantic-major"
        exclude:
          - python: "3.10"
            elasticsearch: "7-pydantic"
          - python: "3.10"
            elasticsearch: "7-pydantic-major"
          - python: "3.10"
            elasticsearch: "8-pydantic"
          - python: "3.10"
            elasticsearch: "8-pydantic-major"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v5
      - name: 🧰 Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 🧰 Install dependencies
        run: pip install .[tests,tests-es${{ matrix.elasticsearch }}]
      - name: 🔍 Check Python code
        run: ruff check .
  python-typing:
    name: "🔍 Check Python static typing"
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        # Type checkers only see the canonical Elasticsearch (DSL) packages, so check against these.
        elasticsearch:
          - "7-dsl"
          - "7-pydantic"
          - "8-dsl"
          - "8-pydantic"
        ray:
          - "minimum"
          - "latest"
        include:
          # Ray 2.49 does not support pandas 3 yet.
          - ray: "minimum"
            ray-requirements: '"ray[data]~=2.49.0" "pandas<3"'
          - ray: "latest"
            ray-requirements: ""
        exclude:
          # Ray 2.49 has no wheels for Python 3.14.
          - python: "3.14"
            ray: "minimum"
          - python: "3.10"
            elasticsearch: "7-pydantic"
          - python: "3.10"
            elasticsearch: "8-pydantic"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v5
      - name: "🧰 Install Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install .[tests,tests-es${{ matrix.elasticsearch }}] ${{ matrix.ray-requirements }}
      - name: "🔍 Check Python static typing"
        run: ty check .
  python-test:
    name: "🧪 Test Python code"
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        elasticsearch:
          - "7"
          - "7-major"
          - "7-dsl"
          - "7-dsl-major"
          - "7-pydantic"
          - "7-pydantic-major"
          - "8"
          - "8-major"
          - "8-dsl"
          - "8-dsl-major"
          - "8-pydantic"
          - "8-pydantic-major"
        ray:
          - "minimum"
          - "latest"
        include:
          # Ray 2.49 does not support pandas 3 yet.
          - ray: "minimum"
            ray-requirements: '"ray[data]~=2.49.0" "pandas<3"'
          - ray: "latest"
            ray-requirements: ""
        exclude:
          # Ray 2.49 has no wheels for Python 3.14.
          - python: "3.14"
            ray: "minimum"
          - python: "3.10"
            elasticsearch: "7-pydantic"
          - python: "3.10"
            elasticsearch: "7-pydantic-major"
          - python: "3.10"
            elasticsearch: "8-pydantic"
          - python: "3.10"
            elasticsearch: "8-pydantic-major"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v5
      - name: "🧰 Install Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install .[tests,tests-es${{ matrix.elasticsearch }}] ${{ matrix.ray-requirements }}
      - name: "🧪 Test Python code"
        run: pytest --cov --cov-report=xml .
      - name: "📤 Upload coverage to Codecov"
        uses: codecov/codecov-action@v5
        if: matrix.python == '3.14' && matrix.ray == 'latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  python-publish:
    name: "🚀 Publish Python wheels"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - python-build
      - python-code-check
      - python-typing
      - python-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v5
      - name: "📥 Download Python wheels"
        uses: actions/download-artifact@v5
        with:
          name: wheels
          path: dist
      - name: "🚀 Publish Python wheels"
        uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    name: "🚀 Create GitHub release"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - python-build
      - python-code-check
      - python-typing
      - python-test
      - python-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v5
      - name: "📥 Download Python wheels"
        uses: actions/download-artifact@v5
        with:
          name: wheels
          path: dist
      - name: "🚀 Create GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
